<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Выпадающее окно: фильтр по разделам каталога -->
<div class="offcanvas offcanvas-end offcanvas-filter" tabindex="-1"
     id="filterOffcanvas" aria-labelledby="filterOffcanvasLabel" th:fragment="filterPanel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="filterOffcanvasLabel">Фильтр</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Закрыть"></button>
    </div>

    <!-- Обернули содержимое в форму. method="GET" передаст параметры в URL (?categoryId=1&categoryId=2) -->
    <form action="/" method="GET" class="offcanvas-body d-flex flex-column h-100 m-0">
        <div class="w-100">
            <!-- Цикл по категориям -->
            <div th:each="category : ${allCategories}" class="form-check mb-2">
                <input class="form-check-input" type="checkbox"
                       name="categoryId"
                       th:value="${category.id}"
                       th:id="'category_' + ${category.id}"
                       th:checked="${selectedCategoryIds != null and selectedCategoryIds.contains(category.id)}">
                <label class="form-check-label"
                       th:for="'category_' + ${category.id}"
                       th:text="${category.name}">
                    Название категории
                </label>
            </div>
        </div>

        <div class="mt-auto text-end pb-3">
            <button class="btn btn-brand" type="submit">Применить</button>
        </div>
    </form>
</div>

</body>
</html>
