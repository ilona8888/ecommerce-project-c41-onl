<!DOCTYPE html>
<html lang="en">
<body>
<div th:fragment="productCard(productCard)">
    <!--/*@thymesVar id="productCard" type="by.tms.ecommerceprojectc41onl.dto.ProductCardDto"*/-->
    <div class="card" style="width: 18rem;">

        <div th:if="${product.photoId != null}">
            <img class="card-img-top" th:src="@{/files/${product.photoId}}" alt="">
        </div>
        <div th:if="${product.photoId == null}">
            <img class="card-img-top" th:src="" alt="">
        </div>

        <div class="card-body">
            <h5 class="card-title mb-3 text-center" th:text="${product.name}"></h5>
            <div class="d-flex justify-content-center mb-3">
                <ul class="list-group list-group-horizontal">
                    <li class="list-group-item border-0" th:text="${product.price}"></li>
                    <li class="list-group-item border-0">
                        <button class="btn btn" type="button">
                            <img th:src="${product.favourite} ? '/static/img/icons/heart-red.png' : '/static/img/icons/heart-love.png'"
                                 alt="">
                        </button>
                    </li>
                    <li class="list-group-item border-0" th:text="${product.score}"></li>
                </ul>
                <div class="text-center">
                    <form th:action="@{/buy/{id}(id=${product.id})}" method="POST">

                        <button type="submit" class="btn btn-primary"
                                style="background-color: var(--brand-blue)">Купить
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
