<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Задаем параметр item -->
<div th:fragment="productCard(item)">
    <div class="card" style="width: 18rem;">

        <!-- Фотография с ограничением высоты -->
        <div th:if="${item.photoId != null}">
            <img class="card-img-top p-2"
                 style="height: 180px; object-fit: contain;"
                 th:src="@{/files/{id}(id=${item.photoId})}" alt="">
        </div>
        <div th:if="${item.photoId == null}">
            <!-- Заглушка, если фото нет -->
            <img class="card-img-top p-2"
                 style="height: 180px; object-fit: contain;"
                 th:src="@{/static/img/icons/no-photo.png}" alt="">
        </div>
        <div class="card-body">
            <!-- Название -->
            <h5 class="card-title mb-3 text-center" th:text="${item.name}"></h5>

            <div class="d-flex justify-content-center mb-3">
                <ul class="list-group list-group-horizontal">
                    <!-- Цена -->
                    <li class="list-group-item border-0" th:text="${item.price}"></li>

                    <!-- Избранное -->
                    <li class="list-group-item border-0">
                        <form th:action="@{/favorites/toggle}" method="post">
                            <!-- Обязательно передаем ID товара, чтобы контроллер понял, что добавлять -->
                            <input type="hidden" name="itemId" th:value="${item.id}" />

                            <!-- Меняем type="button" на type="submit" -->
                            <button class="btn btn" type="submit">
                                <img th:src="${item.favourite} ? '/static/img/icons/heart-red.png' : '/static/img/icons/heart-love.png'" alt="">
                            </button>
                        </form>
                    </li>

                    <!-- Рейтинг -->
                    <li class="list-group-item border-0" th:text="${item.score}"></li>
                </ul>
                <div class="text-center">
                    <form th:action="@{/buy/{id}(id=${item.id})}" method="POST">
                        <button type="submit" class="btn btn-primary"
                                style="background-color: var(--brand-blue)">Купить
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
