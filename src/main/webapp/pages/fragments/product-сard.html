<!DOCTYPE html>
<html lang="en">
<body>
<div th:fragment="productCard(product)">
    <!--/*@thymesVar id="product" type="by.tms.ecommerceprojectc41onl.dto.ProductCardDto"*/-->

    <div class="card" style="width: 18rem;">
        <a class="text-decoration-none position-relative" th:href="@{/product-details.html(id=${product.id})}">
            <div class="card-body">
                <div style="width:250px;height:250px;">

                    <img class="card-img-top w-100 h-100" style="object-fit:cover;"
                         th:src="${product.photoId != null} ? @{|/files/${product.photoId}|} : @{/static/img/icons/no-photo.png}"
                         alt="">
                </div>
                <h5 class="card-title mb-3 text-center" th:text="${product.name}"></h5>
                <div class="d-flex justify-content-center mb-3">
                    <ul class="list-group list-group-horizontal">
                        <li class="list-group-item border-0" th:text="${product.price}"></li>
                        <li class="list-group-item border-0">
                            <button th:data-id="${product.id}"
                                    th:data-favorite="|${product.isFavorite}|"
                                    th:id="|button-favirite-${product.id}|"
                                    class="btn btn z-3"
                                    type="button">
                                <img class="w-75"
                                     th:src="${product.isFavorite} ? '/static/img/icons/heart-red.png' : '/static/img/icons/heart-love.png'"
                                     alt="">
                            </button>
                        </li>
                        <li class="list-group-item border-0" th:text="${product.score}"></li>
                    </ul>
                </div>
                <div class="text-center"
                     th:if="${user != null and (user.role.name() == 'BUYER' or user.role.name() == 'SELLER')}">
                    <button type="submit"
                            class="btn btn-primary w-100"
                            style="background-color: var(--brand-blue)">
                        Купить
                    </button>
                </div>
            </div>
        </a>
    </div>
</div>
</body>
</html>
