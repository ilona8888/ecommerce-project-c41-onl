<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Избранное</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">
    <div class="container-fluid">
        <h2 class="mb-3">Избранное</h2>

        <!-- Сетка с карточками товаров, добавленных в избранное -->
        <div class="w-100 bg-light p-3" style="min-height: 400px;">

            <div th:if="${#lists.isEmpty(productCards)}" class="text-secondary">
                В избранном пока пусто.
            </div>

            <div class="row g-4">
                <div th:each="product : ${productCards}"
                     class="col-6 col-md-4 col-lg-3">
                    <div th:replace="~{fragments/product-сard :: productCard(product, '/favorites')}"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
