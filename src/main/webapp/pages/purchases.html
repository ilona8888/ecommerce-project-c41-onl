<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Покупки</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">

    <div class="container-fluid">

        <h2 class="mb-3">Покупки</h2>

        <div class="w-100 bg-light p-4 rounded d-flex justify-content-center align-items-center"
             style="min-height: 400px;">

            <!-- Если список пуст -->
            <div th:if="${#lists.isEmpty(purchases)}">
                <p class="fs-4 text-muted">У вас пока нет покупок</p>
            </div>

            <!-- Если список НЕ пуст -->
            <div th:unless="${#lists.isEmpty(purchases)}" class="w-100">
                <div th:each="purchase : ${purchases}">
                    <div th:replace="~{fragments/review :: reviewForm(
                            ${purchase.product.id},
                            @{/reviews},
                            @{/reviews/comment})}">
                    </div>
                </div>
            </div>

        </div>

        <!-- Список покупок под формами -->
        <div th:unless="${#lists.isEmpty(purchases)}" class="mt-4">
            <ul class="list-group">
                <li class="list-group-item" th:each="purchase : ${purchases}">
                    <strong th:text="${purchase.product.name}">Название</strong> —
                    <span th:text="${purchase.product.price} + ' руб.'">Цена</span>
                    (Куплено:
                    <span th:text="${#temporals.format(purchase.purchaseDate, 'dd.MM.yyyy HH:mm')}">
                        Дата
                    </span>)
                </li>
            </ul>
        </div>

        <a th:href="@{/}" class="btn btn-outline-primary mt-4">Вернуться в каталог</a>

    </div>

</main>


<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
