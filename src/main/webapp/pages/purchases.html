<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Покупки</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">
    <div class="container-fluid">
        <h2 class="mb-3">Покупки</h2>

        <!-- Тут будет список купленных товаров с формой комментария и оценки -->
        <div class="w-100 bg-light p-3" style="min-height: 400px;">
            <div th:if="${purchases != null}" th:each="purchase : ${purchases}">
                <div th:replace="~{fragments/review :: reviewForm(
                        ${purchase.product.id},
                        @{/reviews},
                        @{/reviews/comment})}"></div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
