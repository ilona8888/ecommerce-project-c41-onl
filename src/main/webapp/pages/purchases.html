<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Покупки</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">
    <div class="container-fluid">

        <h2 class="mb-3">Покупки</h2>

        <!-- Если список пуст (показываем большой серый блок с сообщением) -->
        <div th:if="${#lists.isEmpty(purchases)}" class="w-100 bg-light p-4 rounded d-flex justify-content-center align-items-center" style="min-height: 400px;">
            <p class="fs-4 text-muted">У вас пока нет покупок</p>
        </div>

        <!-- Если список НЕ пуст (показываем наши карточки без лишних форм сверху) -->
        <div th:unless="${#lists.isEmpty(purchases)}" class="mt-4">
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div class="col" th:each="purchase : ${purchases}">
                    <div class="card h-100 shadow-sm p-3">
                        <div class="card-body p-0 d-flex flex-column">

                            <!-- Верхняя часть карточки (стиль как в каталоге) -->
                            <div class="mb-3">
                                <h5 class="card-title text-center mb-3" th:text="${purchase.product.name}">Название</h5>

                                <div class="d-flex justify-content-between align-items-center">
                                    <!-- Цена -->
                                    <span class="fs-6" th:text="${purchase.product.price} + ' руб.'">1.00 руб.</span>

                                    <!-- Иконка избранного -->
                                    <button class="btn p-0 text-dark" type="button">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                    </button>

                                    <!-- Рейтинг -->
                                    <span class="text-muted small">0.0</span>

                                    <!-- Кнопка купить -->
                                    <button class="btn btn-info text-white btn-sm px-3">Купить</button>
                                </div>
                            </div>

                            <!-- Информация о дате покупки -->
                            <div class="text-muted text-center small mb-3">
                                Куплено: <span th:text="${#temporals.format(purchase.purchaseDate, 'dd.MM.yyyy HH:mm')}">Дата</span>
                            </div>

                            <!-- Компактная форма отзыва -->
                            <div class="mt-auto border-top pt-3">
                                <span class="d-block mb-2 text-muted small">Оставить отзыв</span>
                                <form th:action="@{/review/add}" method="post" class="d-flex flex-column">
                                    <input type="hidden" name="productId" th:value="${purchase.product.id}" />
                                    <input type="text" name="comment" class="form-control mb-2 form-control-sm" placeholder="Оставить комментарий" required>

                                    <div class="d-flex justify-content-between align-items-center">
                                        <div class="text-warning">
                                            <button type="button" class="btn btn-sm btn-outline-warning p-1">★</button>
                                            <button type="button" class="btn btn-sm btn-outline-warning p-1">★</button>
                                            <button type="button" class="btn btn-sm btn-outline-warning p-1">★</button>
                                            <button type="button" class="btn btn-sm btn-outline-warning p-1">★</button>
                                            <button type="button" class="btn btn-sm btn-outline-warning p-1">★</button>
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-sm">Отправить</button>
                                    </div>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <a th:href="@{/}" class="btn btn-outline-primary mt-4 mb-4">Вернуться в каталог</a>

    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
