<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Покупки</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">
    <div class="container-fluid">

        <h2 class="mb-3">Покупки</h2>

        <!-- Если список пуст (показываем большой серый блок с сообщением) -->
        <div th:if="${#lists.isEmpty(purchases)}" class="w-100 bg-light p-4 rounded d-flex justify-content-center align-items-center" style="min-height: 400px;">
            <p class="fs-4 text-muted">У вас пока нет покупок</p>
        </div>

        <!-- Если список НЕ пуст (показываем наши карточки без лишних форм сверху) -->
        <div th:unless="${#lists.isEmpty(purchases)}" class="mt-4">
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div class="col" th:each="purchase : ${purchases}"
                     th:with="product=${purchaseProductCards[purchase.product.id]}">
                    <div class="card h-100 shadow-sm p-3">
                        <div class="card-body p-0 d-flex flex-column">

                            <!-- Верхняя часть карточки (стиль как в каталоге) -->
                            <div class="mb-3">
                                <h5 class="card-title text-center mb-3" th:text="${purchase.product.name}">Название</h5>

                                <div class="d-flex justify-content-between align-items-center">
                                    <!-- Цена -->
                                    <span class="fs-6" th:text="${purchase.product.price} + ' руб.'">1.00 руб.</span>

                                    <!-- Иконка избранного -->
                                    <form th:unless="${product.favorite}" method="post" class="m-0"
                                          th:action="@{/favorites/add/{id}(id=${product.id})}">
                                        <button class="btn p-0" type="submit" title="Добавить в избранное">
                                            <img th:src="@{/static/img/icons/heart-love.png}" alt="" width="24" height="24">
                                        </button>
                                    </form>

                                    <form th:if="${product.favorite}" method="post" class="m-0"
                                          th:action="@{/favorites/remove/{id}(id=${product.id})}">
                                        <button class="btn p-0" type="submit" title="Убрать из избранного">
                                            <img th:src="@{/static/img/icons/heart-red.png}" alt="" width="24" height="24">
                                        </button>
                                    </form>

                                    <!-- Рейтинг -->
                                    <span class="text-muted small d-flex align-items-center gap-1">
                                        <span th:if="${product.score > 0}" class="text-warning">★</span>
                                        <span th:text="${product.score > 0 ? product.score : 'Нет оценок'}">Нет оценок</span>
                                    </span>

                                    <!-- Кнопка купить -->
                                    <form th:action="@{/buy/{id}(id=${product.id})}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-info text-white btn-sm px-3">
                                            Купить ещё раз
                                        </button>
                                    </form>
                                </div>
                            </div>

                            <!-- Информация о дате покупки -->
                            <div class="text-muted text-center small mb-3">
                                Куплено: <span th:text="${#temporals.format(purchase.purchaseDate, 'dd.MM.yyyy HH:mm')}">Дата</span>
                            </div>

                            <!-- Компактная форма отзыва -->
                            <div class="mt-auto border-top pt-3">

                                <div th:if="${reviewError != null and reviewErrorProductId == purchase.product.id}"
                                     th:text="${reviewError}"
                                     class="alert alert-warning py-2"
                                     role="alert">
                                    Оцените товар
                                </div>

                                <!-- 1. Форма для выставления оценки (звёзды) -->
                                <form th:action="@{/reviews}" method="POST" class="mb-2">
                                    <input type="hidden" name="productId" th:value="${purchase.product.id}" />

                                    <div class="d-flex align-items-center justify-content-between mb-2">
                                        <span class="text-muted small">Оцените товар:</span>
                                        <div class="text-warning">
                                            <!-- Теперь это кнопки type="submit". Клик по звезде = отправка оценки -->
                                            <button type="submit" name="rating" value="1" class="btn btn-sm btn-outline-warning p-1">★</button>
                                            <button type="submit" name="rating" value="2" class="btn btn-sm btn-outline-warning p-1">★</button>
                                            <button type="submit" name="rating" value="3" class="btn btn-sm btn-outline-warning p-1">★</button>
                                            <button type="submit" name="rating" value="4" class="btn btn-sm btn-outline-warning p-1">★</button>
                                            <button type="submit" name="rating" value="5" class="btn btn-sm btn-outline-warning p-1">★</button>
                                        </div>
                                    </div>
                                </form>

                                <!-- 2. Форма для текста комментария -->
                                <form th:action="@{/reviews/comment}" method="post">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <input type="hidden" name="productId" th:value="${purchase.product.id}">
                                        <input type="text" name="comment" class="form-control me-2 form-control-sm" placeholder="Написать комментарий..." required>
                                        <button type="submit" class="btn btn-primary btn-sm">Отправить</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <a th:href="@{/}" class="btn btn-outline-primary mt-4 mb-4">Вернуться в каталог</a>

    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
