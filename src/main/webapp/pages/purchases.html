<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Покупки</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">
    <div class="container-fluid">
        <h2 class="mb-3">Покупки</h2>

        <!-- Тут будет список купленных товаров с формой комментария и оценки -->
        <div class="w-100 bg-light p-3" style="min-height: 400px;"></div>
    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои покупки</title>
</head>
<body>
<h1>Мои покупки</h1>

<!-- Если список пуст -->
<div th:if="${#lists.isEmpty(purchases)}">
    <p>У вас пока нет покупок</p>
</div>

<!-- Если что-то есть -->
<div th:unless="${#lists.isEmpty(purchases)}">
    <ul>
        <li th:each="purchase : ${purchases}">
            <strong th:text="${purchase.product.name}">Название</strong> —
            <span th:text="${purchase.product.price} + ' руб.'">Цена</span>
            (Куплено: <span th:text="${#temporals.format(purchase.purchaseDate, 'dd.MM.yyyy HH:mm')}">Дата</span>)
        </li>
    </ul>
</div>

<a th:href="@{/}">Вернуться в каталог</a>

</body>
</html>
