<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Восстановление пароля</title>

    <!-- Bootstrap-->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <h3 class="mb-3">Восстановить пароль</h3>
                        <p class="text-secondary">
                            Введите адрес электронной почты, который вы использовали для регистрации,
                            и мы подготовим для вас ссылку для сброса пароля.
                        </p>

                        <!-- Тут будет форма восстановления пароля (обработчик появится на следующем этапе) -->
                        <form th:action="@{/password-recovery}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label visually-hidden">Электронная почта</label>
                                <input type="email" class="form-control form-control-lg"
                                       id="email" name="email" placeholder="email@example.com">
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mb-2">Сбросить пароль</button>
                            <a class="btn btn-outline-primary btn-lg w-100" th:href="@{/login}">Вернуться к входу</a>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
