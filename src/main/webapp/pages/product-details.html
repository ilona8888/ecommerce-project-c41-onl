<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Карточка товара</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-4">
    <div class="container-fluid">

        <div class="row g-4">
            <!-- Левая колонка: фото -->
            <div class="col-12 col-lg-5 d-flex">
                <div class="w-100 bg-light p-3 d-flex align-items-center justify-content-center"
                     style="min-height: 420px;">
                    <img th:if="${product != null and product.photoId != null}"
                         th:src="@{/files/{id}(id=${product.photoId})}"
                         alt="Фото товара"
                         class="rounded shadow"
                         style="width: 100%; height: auto; object-fit: contain;"/>

                    <img th:if="${product == null or product.photoId == null}"
                         th:src="@{/static/img/icons/no-photo.png}"
                         alt="Нет фото"
                         class="rounded shadow"
                         style="width: 100%; height: auto; object-fit: contain;"/>
                </div>
            </div>

            <!-- Правая колонка: название, описание, цена, кнопка "Купить" -->
            <div class="col-12 col-lg-7 d-flex">
                <div class="w-100 bg-white p-4 d-flex flex-column"
                     style="min-height: 420px; max-height: 600px; overflow-y: auto;">

                    <h1 th:text="${product != null ? product.name : 'Товар не найден'}">Название</h1>
                    <p class="text-break" th:text="${product != null ? product.description : 'Описание отсутствует'}">
                        Описание</p>
                    <h3 class="text-primary" th:text="${product != null ? product.price : '0.00'}">0.00</h3>

                    <!-- Форма Купить -->
                    <form th:if="${product != null}" th:action="@{/buy/{id}(id=${product.id})}" method="post"
                          class="mt-auto">
                        <button type="submit" class="btn btn-success btn-lg mt-3">Купить</button>
                    </form>

                    <p th:if="${product == null}" class="text-danger mt-auto">Товар не найден</p>
                </div>
            </div>
        </div>

        <!-- Тут будет список комментариев с оценками -->
        <div class="w-100 bg-light p-3 mt-4" style="min-height: 160px;">
            <h4 class="mb-3">Отзывы</h4>
            <p th:if="${reviews == null or #lists.isEmpty(reviews)}" class="text-muted mb-0">Отзывов пока нет.</p>
            <div th:if="${reviews != null}" th:each="review : ${reviews}" class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between gap-3">
                        <strong th:text="${review.user.userName}">Пользователь</strong>
                        <span class="text-warning" th:attr="aria-label=${review.rating + ' из 5'}">
                            <th:block th:each="score : ${#numbers.sequence(1, 5)}"
                                      th:text="${score <= review.rating ? '★' : '☆'}"></th:block>
                        </span>
                    </div>
                    <p th:if="${review.comment != null and !#strings.isEmpty(review.comment)}"
                       th:text="${review.comment}" class="mb-0 mt-2">Комментарий пользователя</p>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
