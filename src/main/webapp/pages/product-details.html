<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Карточка товара</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-4">
    <div class="container-fluid">
        <div class="row g-4">

            <div class="col-12 col-lg-5">
                <!-- Тут будет изображение товара -->
                <div class="w-100 bg-light p-3" style="min-height: 420px;"></div>
            </div>

            <div class="col-12 col-lg-7">
                <!-- Тут будет описание товара: название, продавец, описание, цена, кнопка «Купить» -->
                <div class="w-100 bg-white p-3" style="min-height: 420px;"></div>
            </div>
        </div>

        <!-- Тут будет список комментариев с оценками -->
        <div class="w-100 bg-light p-3 mt-4" style="min-height: 160px;"></div>
    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
