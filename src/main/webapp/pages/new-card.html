<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Создание карточки товара</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
    <style>
        .card-background {
            background-color: var(--brand-purple);
        }
    </style>
</head>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const myModal = new bootstrap.Modal(document.getElementById('CardModal'));
        myModal.show();
    });
</script>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-5">
    <div class="modal fade" id="CardModal" tabindex="-1" aria-labelledby="CardModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content card-background">
                <div class="modal-header">
                    <h5 class="modal-title" id="CardModalLabel" style="color: white">Создание карточки</h5>
                    <!--Это можно добавить -->
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/create}" th:object="${createProductRequestDto}" method="post"
                          enctype="multipart/form-data">
                        <div class="form-group">
                            <input type="file" class="form-control mb-3" id="file-input" th:field="*{file}"
                                   placeholder="Выберите файл">
                            <input class="form-control mb-3" type="text" id="name-input" th:field="*{name}"
                                   placeholder="Название товара">
                            <input class="form-control mb-3" type="number" id="price-input" th:field="*{price}"
                                   placeholder="Цена">
                            <input class="form-control mb-3" type="text" id="description-input"
                                   th:field="*{description}" placeholder="Описание">
                            <select class="form-control mb-3" id="category-input" th:field="*{categoryId}">
                                <option value="">Выберите категорию</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}">Category Name
                                </option>
                            </select>
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary"
                                        style="background-color: var(--brand-blue)">Создать
                                </button>
                            </div>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
