<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">
    <div class="container-fluid">

        <!-- Это нужно, чтобы заголовок "Профиль" и кнопка "Стать продавцом" красиво стояли на одной строке -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Профиль</h2>

            <!-- Кнопка "Стать продавцом" (показывается только если роль НЕ SELLER) -->
            <div th:if="${userRole != T(by.tms.ecommerceprojectc41onl.model.UserRole).SELLER}">
                <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                        data-bs-target="#becomeSellerModal">
                    Стать продавцом
                </button>
            </div>
        </div>

        <!-- Тут будет подробная информация об учетной записи -->
        <div class="w-100 bg-light p-3" style="min-height: 400px;">
            <div class="container text-left">
                <div class="row">
                    <div class="col">
                        <form th:action="@{/sellerPage/{id}(id=${sellerID})}" th:object="${newSellerPageDto}"
                              method="post">
                            <input type="text" th:field="*{legalEntity}" class="form-control"
                                   placeholder="Индивидуальный предприниматель или Юридическое лицо"
                                   aria-label="legalEntity" aria-describedby="visible-addon">
                            <p th:if="${#fields.hasErrors('legalEntity')}" th:errors="*{legalEntity}"></p>
                            <br>
                            <input type="text" th:field="*{contactInfo}" class="form-control"
                                   placeholder="Контактные данные" aria-label="contactInfo"
                                   aria-describedby="visible-addon">
                            <p th:if="${#fields.hasErrors('contactInfo')}" th:errors="*{contactInfo}"></p>
                            <br>
                            <button type="submit" class="btn btn-info">Изменить</button>
                            <br>
                            <p th:text="${updateError}"></p>
                        </form>
                    </div>
                    <div class="col">
                        <div style="background-color: indigo; height: 300px;">
                            <span style="color: white; font-size: 36px; padding: 30px;"
                                  th:text="${sellerPageDto.getLegalEntity()}"></span>
                            <br>
                            <br>
                            <span style="color: white; font-size: 24px; padding: 30px"
                                  th:text="'Телефон: ' + ${sellerPageDto.getContactInfo()}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</div>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
