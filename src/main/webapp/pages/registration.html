<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <!-- Тут будет форма регистрации (обработчик появится на следующем этапе) -->
                        <form th:action="@{/registration}" method="post" class="row g-3">

                            <div class="col-12 col-md-6">
                                <label for="firstName" class="form-label">Имя</label>
                                <input type="text" class="form-control" id="firstName" name="firstName"
                                       placeholder="Александра">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="lastName" class="form-label">Фамилия</label>
                                <input type="text" class="form-control" id="lastName" name="lastName"
                                       placeholder="Богатко">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="username" class="form-label">Имя пользователя</label>
                                <div class="input-group">
                                    <span class="input-group-text">@</span>
                                    <input type="text" class="form-control" id="username" name="username">
                                </div>
                            </div>

                            <div class="col-12 col-md-3">
                                <label for="birthDate" class="form-label">Дата рождения</label>
                                <input type="date" class="form-control" id="birthDate" name="birthDate">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="email" class="form-label">Электронная почта</label>
                                <input type="email" class="form-control" id="email" name="email">
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="password" class="form-label">Пароль</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" name="password">
                                    <!-- Тут будет кнопка показа пароля -->
                                    <button class="btn btn-outline-secondary" type="button">&#128065;</button>
                                </div>
                                <div class="form-text">
                                    Ваш пароль должен состоять из 8&ndash;20 символов, содержать буквы,
                                    цифры и специальные символы и не должен содержать пробелы или эмодзи
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="terms" name="terms">
                                    <label class="form-check-label" for="terms">Согласен с условиями</label>
                                </div>
                            </div>

                            <div class="col-12 d-flex align-items-center gap-3">
                                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                                <a th:href="@{/login}">Уже есть аккаунт? Войти</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
