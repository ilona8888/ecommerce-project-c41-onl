<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админка</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">

    <style>
        .card-background {
            background-color: var(--brand-purple, #4f2e84);
        }
        .btn-close-white {
            filter: invert(1);
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">
    <div class="container-fluid">
        <h2 class="mb-3">Категории</h2>

        <ul class="list-group">
            <li class="list-group-item" th:each="category : ${categories}">
                <span th:text="${category.name}"></span>
            </li>
        </ul>
    </div>
</main>

<!-- Модальное окно создания категории-->
<div class="modal fade" id="CardModal" tabindex="-1" aria-labelledby="CardModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content card-background">
            <div class="modal-header">
                <h5 class="modal-title text-white" id="CardModalLabel">Создание категории</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/new-category}" th:object="${categoryDto}" method="post">
                    <div class="mb-3">
                        <label for="name-input" class="form-label text-white">Название категории</label>
                        <input type="text" class="form-control" id="name-input" th:field="*{name}"
                               placeholder="Например: Электроника"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:if="${#fields.hasErrors('categoryDto.name')} or ${#fields.hasAnyErrors()}">
    document.addEventListener('DOMContentLoaded', function () {
        const modalElement = document.getElementById('CardModal');
        if (modalElement) {
            const myModal = new bootstrap.Modal(modalElement);
            myModal.show();

            modalElement.addEventListener('hidden.bs.modal', function () {
                window.location.href = "/admin";
            });
        }
    });
</script>
</body>
</html>
