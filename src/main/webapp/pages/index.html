<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог товаров</title>

    <!-- Bootstrap-->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">
    <div class="container-fluid">

        <!-- Кнопка открытия фильтра по разделам -->
        <button class="btn btn-brand mb-3" type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#filterOffcanvas"
                aria-controls="filterOffcanvas">
            Фильтр
        </button>

        <!-- Сетка с карточками товаров -->
        <div class="w-100 bg-light p-3" style="min-height: 400px;">
            <div class="row g-3" id="products-container">
                <div th:each="product : ${productCards}"
                     class="col-6 col-md-3 col-lg-2">

                    <div class="card w-100" style="max-width: 18rem;">
                        <a class="text-decoration-none position-relative"
                           th:href="@{/product-details.html(id=${product.id})}">
                            <div class="card-body">
                                <div class="ratio ratio-1x1 mt-2 mb-3 px-2">
                                    <img class="card-img-top"
                                         style="object-fit: cover;"
                                         th:src="${product.photoId != null}
                                                 ? @{/files/{id}(id=${product.photoId})}
                                                 : @{/static/img/icons/no-photo.png}"
                                         alt="">
                                </div>
                            </div>
                        </a>

                        <h5 class="card-title mb-3 text-center"
                            th:text="${product.name}"></h5>

                        <div class="d-flex justify-content-center mb-3">
                            <ul class="d-flex flex-row align-items-center gap-3 p-0 m-0" style="list-style:none;">
                                <li class="list-group-item border-0"
                                    th:text="${product.price}"></li>

                                <li class="list-group-item border-0">
                                    <button th:data-id="${product.id}"
                                            th:data-favorite="|${product.isFavorite}|"
                                            th:id="|button-favirite-${product.id}|"
                                            class="btn btn z-3"
                                            type="button">
                                        <img style="width: 28px; height: 28px;"
                                             th:src="${product.isFavorite}
                                                     ? '/static/img/icons/heart-red.png'
                                                     : '/static/img/icons/heart-love.png'"
                                             alt="">
                                    </button>
                                </li>

                                <li class="list-group-item border-0"
                                    th:text="${product.score > 0 ? product.score : 'Нет оценок'}">
                                </li>
                            </ul>
                        </div>

                        <div class="text-center"
                             th:if="${user != null and (user.role.name() == 'BUYER' or user.role.name() == 'SELLER')}">
                            <form th:action="@{/buy/{id}(id=${product.id})}" method="POST">
                                <button type="submit"
                                        class="btn btn-primary w-100 mb-4"
                                        style="background-color: var(--brand-blue); max-width: 90%; margin: 0 auto;">
                                    Купить
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>


        <!--        &lt;!&ndash; Сообщение, если совпадений нет &ndash;&gt;-->
        <!--        <div th:if="${notFoundMessage != null}">-->
        <!--            <p style="color: red;" th:text="${notFoundMessage}"></p>-->
        <!--        </div>-->

        <!--        &lt;!&ndash; Отображение списка товаров &ndash;&gt;-->
        <!--        <div th:if="${products != null and !products.isEmpty()}">-->
        <!--            <h2>Результаты поиска:</h2>-->
        <!--            <div class="product-list">-->
        <!--                <div th:each="product : ${products}" class="product-card" style="border: 1px solid #ccc; margin: 10px; padding: 10px;">-->
        <!--                    <h3 th:text="${product.name}">Название товара</h3>-->
        <!--                    <p th:text="'Цена: ' + ${product.price} + ' руб.'">Цена</p>-->
        <!--                </div>-->
        <!--            </div>-->
        <!--        </div>-->
    </div>
</main>

<div th:replace="~{fragments/filter :: filterPanel}"></div>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('products-container');
        if (container) {
            container.addEventListener('click', async (event) => {
                const btn = event.target.closest('[id^="button-favirite-"]');
                if (!btn) {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                // Define your query parameters
                const params = {
                    'product-id': btn.dataset.id,
                    flag: !(btn.dataset.favorite === 'true'),

                };

                // Convert the object to a query string: ?search=javascript&limit=10&page=1
                const queryString = new URLSearchParams(params).toString();

                try {
                    const response = await fetch(`/favorite?${queryString}`,
                        {
                            method: 'POST',
                            redirect: 'follow'
                        }
                    )

                    // // HTTP 301 response
                    // // HOW CAN I FOLLOW THE HTTP REDIRECT RESPONSE?
                    if (response.redirected) {
                        window.location.href = response.url;
                    }
                } catch (error) {
                    console.error('Fetch failed:', error);
                }

            })
        }
    });
</script>
