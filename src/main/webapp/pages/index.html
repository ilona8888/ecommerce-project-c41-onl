<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог товаров</title>

    <!-- Bootstrap-->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">
    <div class="container-fluid">

        <!-- Кнопка открытия фильтра по разделам -->
        <button class="btn btn-brand mb-3" type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#filterOffcanvas"
                aria-controls="filterOffcanvas">
            Фильтр
        </button>

        <!-- Тут будет сетка с карточками товаров -->
        <div class="w-100 bg-light p-3" style="min-height: 400px;">
<!--            Отладка-->
            <p style="color: red;">Debug</p>
            <p style="color: red;">Размер списка: <b th:text="${#lists.size(productCards)}"></b></p>
            <p style="color: blue;" th:if="${productCards == null}">productCards == null</p>

            <div class="row g-4">
                <div th:each="product : ${productCards}"
                     class="col-6 col-md-4 col-lg-3">
                    <div class="card" style="width: 18rem;">

<!--                        <div th:if="${product.photoId != null}">-->
<!--                            <img class="card-img-top" th:src="@{/files/${product.photoId}}" alt="">-->
<!--                        </div>-->
<!--                        <div th:if="${product.photoId == null}">-->
<!--                            <img class="card-img-top" th:src="" alt="">-->
<!--                        </div>-->
                        <div class="card-body">
                            <h5 class="card-title mb-3 text-center" th:text="${product.name}"></h5>
                            <div class="d-flex justify-content-center mb-3">
                                <ul class="list-group list-group-horizontal">
                                    <li class="list-group-item border-0" th:text="${product.price}"></li>
                                    <li class="list-group-item border-0">
                                        <button class="btn btn-primary d-none" type="button">
                                            <img th:src="${product.favourite} ? '/static/img/icons/heart-red.png' : '/static/img/icons/heart-love.png'"
                                                 alt="">
                                        </button>
                                    </li>
                                    <li class="list-group-item border-0" th:text="${product.score}"></li>
                                </ul>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary"
                                        style="background-color: var(--brand-blue)">Купить
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


<!--        &lt;!&ndash; Сообщение, если совпадений нет &ndash;&gt;-->
<!--        <div th:if="${notFoundMessage != null}">-->
<!--            <p style="color: red;" th:text="${notFoundMessage}"></p>-->
<!--        </div>-->

<!--        &lt;!&ndash; Отображение списка товаров &ndash;&gt;-->
<!--        <div th:if="${products != null and !products.isEmpty()}">-->
<!--            <h2>Результаты поиска:</h2>-->
<!--            <div class="product-list">-->
<!--                <div th:each="product : ${products}" class="product-card" style="border: 1px solid #ccc; margin: 10px; padding: 10px;">-->
<!--                    <h3 th:text="${product.name}">Название товара</h3>-->
<!--                    <p th:text="'Цена: ' + ${product.price} + ' руб.'">Цена</p>-->
<!--                </div>-->
<!--            </div>-->
<!--        </div>-->
    </div>
</main>

<div th:replace="~{fragments/filter :: filterPanel}"></div>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!--</form>-->


</body>
</html>
