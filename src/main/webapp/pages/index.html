<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог товаров</title>

    <!-- Bootstrap-->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">
    <div class="container-fluid">

        <!-- Кнопка открытия фильтра по разделам -->
        <button class="btn btn-brand mb-3" type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#filterOffcanvas"
                aria-controls="filterOffcanvas">
            Фильтр
        </button>

        <!-- Тут будет сетка с карточками товаров -->
        <div class="w-100 bg-light p-3" style="min-height: 400px;"></div>
    </div>
</main>

<div th:replace="~{fragments/filter :: filterPanel}"></div>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Форма поиска -->
<form th:action="@{/search}" method="get">
    <input type="text" name="keyword" th:value="${keyword}" placeholder="Найти товар" required/>
    <button type="submit">Искать</button>
</form>

<hr>

<!-- Сообщение, если совпадений нет -->
<div th:if="${notFoundMessage != null}">
    <p style="color: red;" th:text="${notFoundMessage}"></p>
</div>

<!-- Отображение списка товаров -->
<div th:if="${products != null and !products.isEmpty()}">
    <h2>Результаты поиска:</h2>
    <div class="product-list">
        <div th:each="product : ${products}" class="product-card" style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
            <h3 th:text="${product.name}">Название товара</h3>
            <p th:text="'Цена: ' + ${product.price} + ' руб.'">Цена</p>
        </div>
    </div>
</div>

</body>
</html>
