<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог товаров</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-3">
    <div class="container-fluid">
        <button class="btn btn-brand mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterOffcanvas">
            Фильтр
        </button>

        <div class="w-100 bg-light p-3" style="min-height: 400px;">
            <div class="row g-4">
                <div th:each="product : ${productCards}"
                     class="col-6 col-md-4 col-lg-3">
                    <a th:href="@{/product?productId={id}(id=${product.id})}" class="text-decoration-none text-reset">
                        <div th:replace="~{fragments/product-сard :: productCard(product, '/')}"></div>
                    </a>
                </div>
            </div>
        </div>

        <!-- === БЛОК РЕЗУЛЬТАТОВ ПОИСКА === -->
        <th:block th:if="${products != null and not #lists.isEmpty(products)}">
            <h2 class="mb-3">Результаты поиска:</h2>
            <div class="w-100 bg-light p-3" style="min-height: 400px;">
                <div class="row g-4">
                    <div th:each="product : ${products}" class="col-6 col-md-4 col-lg-3">
                        <a th:href="@{/product?productId={id}(id=${product.id})}" class="text-decoration-none text-reset">
                            <div th:replace="~{fragments/product-сard :: productCard(${product})}"></div>
                        </a>
                    </div>
                </div>
            </div>
        </th:block>

        <!-- === БЛОК КАТАЛОГА ПО УМОЛЧАНИЮ === -->
        <th:block th:unless="${products != null or notFoundMessage != null}">
            <div class="w-100 bg-light p-3" style="min-height: 400px;">
                <div class="row g-4">
                    <div th:each="product : ${productCards}" class="col-6 col-md-4 col-lg-3">
                        <a th:href="@{/product?productId={id}(id=${product.id})}" class="text-decoration-none text-reset">
                            <div th:replace="~{fragments/product-сard :: productCard(${product})}"></div>
                        </a>
                    </div>
                </div>
            </div>
        </th:block>

    </div>
</main>

<div th:replace="~{fragments/filter :: filterPanel}"></div>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('products-container');
        if (container) {
            container.addEventListener('click', async (event) => {
                const btn = event.target.closest('[id^="button-favirite-"]');
                if (!btn) {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                const params = {
                    'product-id': btn.dataset.id,
                    flag: !(btn.dataset.favorite === 'true'),
                };
                const queryString = new URLSearchParams(params).toString();
                try {
                    const response = await fetch(`/favorite?${queryString}`, { method: 'POST', redirect: 'follow' });
                    if (response.redirected) {
                        window.location.href = response.url;
                    }
                } catch (error) {
                    console.error('Fetch failed:', error);
                }
            });
        }
    });
</script>

</body>
</html>
