<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Авторизация</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Собственные стили -->
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <!-- Тут будет форма авторизации (обработчик появится на следующем этапе) -->
                        <form th:action="@{/login}" method="post">

                            <div class="mb-3">
                                <label for="email" class="form-label fs-5">Email address</label>
                                <input type="email" class="form-control form-control-lg"
                                       id="email" name="email" placeholder="alex.bgtk@gmail.com">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fs-5">Password</label>
                                <div class="input-group input-group-lg">
                                    <input type="password" class="form-control" id="password" name="password">
                                    <!-- Тут будет кнопка показа пароля -->
                                    <button class="btn btn-outline-secondary" type="button">&#128065;</button>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
                                <label class="form-check-label fs-5" for="rememberMe">Запомнить меня</label>
                            </div>

                            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary btn-lg">Log in</button>
                                    <a class="btn btn-outline-primary btn-lg" th:href="@{/registration}">Sign in</a>
                                </div>
                                <a class="btn btn-light btn-lg" th:href="@{/password-recovery}">Forgot your password?</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
